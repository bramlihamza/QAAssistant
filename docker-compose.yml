services:
  qa-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    image: qa-assistant:latest
    container_name: qa-assistant-api
    ports:
      - "8000:8000"
    environment:
      # ── LLM ──────────────────────────────────────────────────────────────
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MODEL=${MODEL:-gpt-4o-mini}
      - TEMPERATURE=${TEMPERATURE:-0}
      - MAX_TOKENS=${MAX_TOKENS:-2048}
      # ── Embeddings ────────────────────────────────────────────────────────
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      # ── RAG ───────────────────────────────────────────────────────────────
      - ISTQB_DOCS_DIR=/pdf
      - CHROMA_COLLECTION=${CHROMA_COLLECTION:-istqb_best_practices}
      - CHROMA_PERSIST_DIR=/app/chroma_db
      - RAG_SCORE_THRESHOLD=${RAG_SCORE_THRESHOLD:-0.10}
      - RAG_TOP_K=${RAG_TOP_K:-5}
      # ── User Stories API ──────────────────────────────────────────────────
      - US_API_ENDPOINT=${US_API_ENDPOINT:-http://host.docker.internal:3000/user_stories_45_generated.json}
    volumes:
      # Persistance de la base vectorielle ChromaDB
      - qa_chroma:/app/chroma_db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # Service d'ingestion — lance l'indexation des PDFs puis s'arrête
  ingest:
    build:
      context: .
      dockerfile: Dockerfile
    image: qa-assistant:latest
    container_name: qa-assistant-ingest
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - ISTQB_DOCS_DIR=/pdf
      - CHROMA_COLLECTION=${CHROMA_COLLECTION:-istqb_best_practices}
      - CHROMA_PERSIST_DIR=/app/chroma_db
    volumes:
      - qa_chroma:/app/chroma_db
    command: ["python", "scripts/ingest_docs.py"]
    profiles:
      - ingest   # lancé uniquement avec : docker compose --profile ingest up ingest

volumes:
  qa_chroma:
    name: qa_assistant_chroma
    driver: local
